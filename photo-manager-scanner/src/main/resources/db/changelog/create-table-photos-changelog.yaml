databaseChangeLog:
  - changeSet:
      id: create-table-photos-1
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_photos
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: filename
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: absolute_path
                  type: VARCHAR(512)
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: sha256
                  type: VARCHAR(255)
              - column:
                  name: p_hash_chunk1
                  type: INT
              - column:
                  name: p_hash_chunk2
                  type: INT
              - column:
                  name: p_hash_chunk3
                  type: INT
              - column:
                  name: p_hash_chunk4
                  type: INT
              - column:
                  name: date_taken
                  type: DATE
              - column:
                  name: time_taken
                  type: TIME(6)
              - column:
                  name: camera_make
                  type: VARCHAR(255)
              - column:
                  name: camera_model
                  type: VARCHAR(255)
              - column:
                  name: width
                  type: INT
              - column:
                  name: height
                  type: INT
              - column:
                  name: latitude
                  type: DOUBLE
              - column:
                  name: longitude
                  type: DOUBLE
            tableName: photos
  - changeSet:
      id: create-table-photos-2
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addUniqueConstraint:
            columnNames: absolute_path
            constraintName: uc_photos_absolutepath
            tableName: photos
  - changeSet:
      id: create-table-photos-3
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createIndex:
            columns:
              - column:
                  name: p_hash_chunk1
            indexName: idx_chunk1
            tableName: photos
  - changeSet:
      id: create-table-photos-4
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createIndex:
            columns:
              - column:
                  name: p_hash_chunk2
            indexName: idx_chunk2
            tableName: photos
  - changeSet:
      id: create-table-photos-5
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createIndex:
            columns:
              - column:
                  name: p_hash_chunk3
            indexName: idx_chunk3
            tableName: photos
  - changeSet:
      id: create-table-photos-6
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createIndex:
            columns:
              - column:
                  name: p_hash_chunk4
            indexName: idx_chunk4
            tableName: photos
  - changeSet:
      id: create-table-photos-7
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createIndex:
            columns:
              - column:
                  name: sha256
            indexName: idx_sha256
            tableName: photos

