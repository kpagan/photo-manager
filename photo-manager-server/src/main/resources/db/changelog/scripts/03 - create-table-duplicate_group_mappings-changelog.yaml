databaseChangeLog:
  - changeSet:
      id: create-table-duplicate_group_mappings-1
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_duplicate_group_mappings
                  name: group_id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_duplicate_group_mappings
                  name: photo_id
                  type: BIGINT
              - column:
                  name: exact_match
                  type: BOOLEAN
            tableName: duplicate_group_mappings
  - changeSet:
      id: create-table-duplicate_group_mappings-2
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            constraintName: FK_DUP_GRP_MAP_GROUP
            baseTableName: duplicate_group_mappings
            baseColumnNames: group_id
            referencedTableName: duplicate_groups
            referencedColumnNames: id
            onDelete: CASCADE
  - changeSet:
      id: create-table-duplicate_group_mappings-3
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            constraintName: FK_DUP_GRP_MAP_PHOTOS
            baseTableName: duplicate_group_mappings
            baseColumnNames: photo_id
            referencedTableName: photos
            referencedColumnNames: id
            onDelete: CASCADE
  - changeSet:
      id: create-table-duplicate_group_mappings-4
      author: kpagan
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addUniqueConstraint:
            columnNames: photo_id
            constraintName: uc_duplicate_group_mappings_photo
            tableName: duplicate_group_mappings
