spring:
  devtools:
    restart:
      enabled: false
  application:
    name: photo-manager
  datasource:
    url: jdbc:h2:file:/data/${DB_NAME};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  h2:
    console:
      enabled: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
server:
  servlet:
    context-path: /photos/api
photo:
  config:
    directory: ${PHOTO_DIR}
    allowedExtensions: jpg, jpeg, png, heic, webp, gif
    thumbnail:
      max-width: 300
      storage-path: .thumbnails